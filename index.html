<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#112c47">
  <meta name="description" content="Play Flappy Bird, a responsive canvas flying game.">
  <title>Flappy Bird · Skyline Flight</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main id="app" data-state="ready" aria-label="Flappy Bird game">
    <section class="game-shell">
      <canvas id="game" width="360" height="640" aria-label="Flappy Bird game board" tabindex="0"></canvas>
      <header class="hud" aria-live="polite">
        <div><span class="label">SCORE</span><strong id="score">0</strong></div>
        <div class="brand">FLAPPY<br><b>BIRD</b></div>
        <div><span class="label">BEST</span><strong id="best">0</strong></div>
      </header>
      <div id="message" class="message">
        <p class="eyebrow">SKYLINE FLIGHT</p>
        <h1 id="message-title">Ready?</h1>
        <p id="message-copy">Thread the gaps and chase the skyline.</p>
        <button id="start-button" class="primary" type="button" aria-label="Start game">Start flight</button>
      </div>
      <div id="countdown" class="countdown" aria-live="assertive"></div>
      <nav class="controls" aria-label="Game controls">
        <button id="pause-button" type="button" aria-label="Pause game" title="Pause game">Ⅱ</button>
        <button id="music-button" class="music-toggle" type="button" aria-label="Turn music off" aria-pressed="true" title="Turn music off">Music On</button>
      </nav>
      <p class="instructions"><kbd>SPACE</kbd> or tap to flap <span>·</span> <kbd>P</kbd> pause</p>
    </section>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
